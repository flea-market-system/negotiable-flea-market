<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>値下げ申請一覧</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<div class="container mt-5">
		<h2>申請一覧: <span th:text="${item.name}"></span></h2>
		<a th:href="@{/items/{id}(id=${item.id})}" class="btn btn-secondary mb-3">商品に戻る</a>

		<div th:if="${offers.isEmpty()}" class="alert alert-info">
			まだ申請はありません。
		</div>

		<div class="card mb-3" th:each="offer : ${offers}">
			<div class="card-body d-flex justify-content-between align-items-center">
				<div>
					<h5 class="card-title">
						希望価格: <span th:text="${offer.requestedPrice}" class="text-danger fw-bold"></span> 円
					</h5>
					<p class="card-text text-muted">
						申請者: <span th:text="${offer.buyer.name}"></span> さん<br>
						日時: <span th:text="${#temporals.format(offer.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
					</p>
					<span th:text="${offer.status}" class="badge bg-secondary"></span>
				</div>

				<div th:if="${offer.status.name() == 'REQUESTED'}">
					<form th:action="@{/offers/{id}/accept(id=${offer.id})}" method="post" style="display:inline;">
						<button type="submit" class="btn btn-primary"
							onclick="return confirm('本当に承諾しますか？\n他の申請はすべて自動で拒否されます。')">
							承諾する
						</button>
					</form>
					<form th:action="@{/offers/{id}/reject(id=${offer.id})}" method="post" style="display:inline;">
						<button type="submit" class="btn btn-outline-secondary"
							onclick="return confirm('この申請を拒否しますか？')">
							拒否する
						</button>
					</form>
				</div>

				<div th:if="${offer.status.name() == 'ACCEPTED'}">
				    <span class="text-success fw-bold">承諾済み（取引中）</span>
				    <br>
				    <small th:text="'期限: ' + ${#temporals.format(offer.holdsUntil, 'MM/dd HH:mm')}"></small>
				</div>

				<div th:if="${offer.status.name() == 'EXPIRED'}">
				    <span class="text-danger fw-bold">期限切れ（失効）</span>
				    <br>
				    <small class="text-muted" th:text="'失効日時: ' + ${#temporals.format(offer.holdsUntil, 'MM/dd HH:mm')}"></small>
				</div>

				<div th:if="${offer.status.name() == 'REJECTED'}">
				    <span class="text-muted">拒否済み</span>
				</div>
				
			</div>
		</div>
	</div>
</body>

</html>
