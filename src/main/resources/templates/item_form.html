<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>商品出品・編集 - フリマアプリ</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div class="container">
		<h1 th:text="${item.id == null ? '商品出品' : '商品編集'}"></h1>

		<form th:action="${item.id} != null ? @{/items/{id}(id=${item.id})} : @{/items}" th:object="${item}"
			method="post" enctype="multipart/form-data" class="item-form">

			<input type="hidden" th:field="*{id}">

			<div class="form-group">
				<label for="name">商品名 <span class="required">必須</span></label>
				<input type="text" id="name" th:field="*{name}" class="form-control" placeholder="商品名を入力してください" required>
			</div>

			<div class="form-group">
				<label for="description">説明</label>
				<textarea id="description" th:field="*{description}" class="form-control" rows="5" placeholder="商品の説明を入力してください"></textarea>
			</div>

			<div class="form-group">
				<label for="price">価格 <span class="required">必須</span></label>
				<input type="number" id="price" th:field="*{price}" class="form-control" placeholder="価格を入力" min="0" required>
			</div>

			<div class="form-group">
				<label for="categoryId">カテゴリ <span class="required">必須</span></label>
				<div class="select-wrapper">
					<select id="categoryId" name="categoryId" class="form-control" required>
						<option value="" disabled selected>選択してください</option>
						<option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
							th:selected="${item.category != null and item.category.id == category.id}">
						</option>
					</select>
				</div>
			</div>

			<div class="form-group">
				<label for="image">商品画像</label>
				<input type="file" id="image" name="image" class="form-control-file">
			</div>

			<div class="form-actions">
				<button type="submit" class="button primary">保存する</button>
			</div>
		</form>

		<div class="button-group" style="margin-top: 20px; text-align: center;">
			<a th:href="@{/items}" class="text-link">商品一覧に戻る</a>
		</div>
	</div>
</body>

</html>
