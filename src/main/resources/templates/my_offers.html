<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>値下げ申請管理 - フリマアプリ</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div class="container mt-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2>値下げ申請管理</h2>
			<a th:href="@{/my-page}" class="btn btn-secondary">マイページに戻る</a>
		</div>

		<ul class="nav nav-tabs mb-4">
			<li class="nav-item">
				<a class="nav-link" th:classappend="${currentTab == 'outgoing' ? 'active fw-bold' : ''}"
					th:href="@{/my-page/offers(tab='outgoing')}">
					送信した申請
				</a>
			</li>
			<li class="nav-item">
				<a class="nav-link" th:classappend="${currentTab == 'incoming' ? 'active fw-bold' : ''}"
					th:href="@{/my-page/offers(tab='incoming')}">
					受信した申請
				</a>
			</li>
		</ul>

		<div th:if="${offers.isEmpty()}" class="alert alert-info text-center">
			<span th:if="${currentTab == 'outgoing'}">送信した値下げ申請はありません。</span>
			<span th:if="${currentTab == 'incoming'}">受信した値下げ申請はありません。</span>
		</div>

		<div class="row row-cols-1 g-3">
			<div class="col" th:each="offer : ${offers}">
				<div class="card h-100 shadow-sm">
					<div class="card-body">
						<div class="d-flex justify-content-between align-items-start">
							<div>
								<span th:switch="${offer.status.name()}" class="badge mb-2" th:classappend="${
								      offer.status.name() == 'ACCEPTED' ? 'bg-success' : 
								      (offer.status.name() == 'REJECTED' ? 'bg-secondary' : 
								      (offer.status.name() == 'EXPIRED' ? 'bg-danger' : 'bg-primary'))
								  }">
									<span th:case="'REQUESTED'">申請中</span>
									<span th:case="'ACCEPTED'">承諾済み</span>
									<span th:case="'REJECTED'">却下</span>
									<span th:case="'PURCHASED'">取引終了</span>
									<span th:case="'EXPIRED'">期限切れ</span> </span>

								<h5 class="card-title mb-1">
									<a th:href="@{/items/{id}(id=${offer.item.id})}"
										class="text-decoration-none text-dark">
										<span th:text="${offer.item.name}">商品名</span>
									</a>
								</h5>

								<p class="card-text mb-1">
									<span
										class="text-decoration-line-through text-muted small">¥[[${offer.originalPrice}]]</span>
									<i class="bi bi-arrow-right mx-1"></i>
									<span class="fw-bold text-danger fs-5">¥[[${offer.requestedPrice}]]</span>
								</p>
							</div>

							<div class="text-end text-muted small">
								<div>申請日: <span th:text="${#temporals.format(offer.createdAt, 'MM/dd HH:mm')}"></span>
								</div>
								<div th:if="${currentTab == 'incoming'}">
									申請者: <span th:text="${offer.buyer.name}">ユーザー名</span>
								</div>
								<div th:if="${currentTab == 'outgoing'}">
									出品者: <span th:text="${offer.item.seller.name}">ユーザー名</span>
								</div>
							</div>
						</div>

						<div th:if="${currentTab == 'incoming' and offer.status.toString() == 'REQUESTED'}"
							class="mt-3 border-top pt-2 text-end">
							<a th:href="@{/items/{id}/offers(id=${offer.item.id})}"
								class="btn btn-outline-primary btn-sm">
								詳細・承諾画面へ
							</a>
						</div>

						<div th:if="${offer.status.toString() == 'ACCEPTED'}" class="mt-3 border-top pt-2">
							<div
								class="alert alert-success py-2 mb-0 d-flex justify-content-between align-items-center">
								<small>
									<i class="bi bi-clock"></i> 購入期限:
									<span
										th:text="${offer.holdsUntil != null ? #temporals.format(offer.holdsUntil, 'MM/dd HH:mm') : '-'}"></span>
								</small>
								<a th:href="@{/items/{id}(id=${offer.item.id})}"
									class="btn btn-success btn-sm">商品ページへ</a>
							</div>
						</div>
						<div th:if="${offer.status.toString() == 'PURCHASED'}" class="mt-3 border-top pt-2">
							<div
								class="alert alert-secondary py-2 mb-0 d-flex justify-content-between align-items-center">
								<small><i class="bi bi-check-circle-fill"></i> 取引完了</small>
								<a th:href="@{/items/{id}(id=${offer.item.id})}"
									class="btn btn-secondary btn-sm">商品ページへ</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
</body>

</html>
