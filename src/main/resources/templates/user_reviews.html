<!-- HTML5 文書であることを宣言 -->
<!DOCTYPE html>
<!-- ルート要素。言語=日本語、Thymeleaf と Spring Security Dialect を宣言 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- ヘッダー領域：メタ情報・タイトル・スタイル読込 -->

<head>
	<!-- 文字コードを UTF-8 に設定 -->
	<meta charset="UTF-8">
	<!-- ブラウザタブに表示されるページタイトル -->
	<title>自分の評価 - フリマアプリ</title>
	<!-- 共通スタイルシートの読み込み -->
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<!-- 画面本体開始 -->

<body>
	<!-- レイアウト中央寄せのコンテナ -->
	<div class="container">
		<!-- ページ見出し -->
		<h1>自分の評価</h1>
		<!-- ページ説明文 -->
		<p>あなたがもらった評価の一覧です。</p>
		<!-- 評価一覧テーブル -->
		<table>
			<thead>
			    <tr>
			        <th>商品名</th>
			        <th>購入者</th> <th>評価</th>
			        <th>コメント</th>
			        <th>評価日時</th>
			    </tr>
			</thead>
			<tbody>
			    <tr th:each="review : ${reviews}">
			        <td th:text="${review.item.name}"></td>
			        
			        <td th:text="${review.reviewer.name}"></td> 
			        
			        <td>
			            <span th:each="i : ${#numbers.sequence(1, 5)}">
			                <span th:if="${i <= review.rating}">★</span>
			                <span th:if="${i > review.rating}">☆</span>
			            </span>
			        </td>
			        <td th:text="${review.comment}"></td>
			        <td th:text="${#temporals.format(review.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
			    </tr>
			    </tbody>
		</table>
		<!-- 画面下部の戻る導線 -->
		<div class="button-group">
			<!-- マイページへ戻るリンク（セカンダリ） -->
			<a th:href="@{/my-page}" class="button secondary">マイページに戻る</a>
		</div>
	</div>
</body>

</html>
