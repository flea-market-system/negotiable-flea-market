<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title th:text="${item.name} + ' - 商品詳細'"></title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div class="container">
		<h1 th:text="${item.name}"></h1>

		<div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>
		<div th:if="${successMessage}" class="success-message" th:text="${successMessage}"></div>

		<div class="item-detail">
			<img th:src="${item.imageUrl != null ? item.imageUrl : '/images/no-image.png'}" alt="商品画像">
			<p th:text="${item.description}"></p>
			<div class="mb-3">
			    <div th:if="${myWinningOffer != null}" class="p-3 mb-2 bg-light border border-success rounded">
			        <p class="mb-0 text-muted" style="text-decoration: line-through;">
			            ¥<span th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}"></span>
			        </p>
			        <p class="fs-2 fw-bold text-danger mb-0">
			            ¥<span th:text="${#numbers.formatDecimal(myWinningOffer.requestedPrice, 0, 'COMMA', 0, 'POINT')}"></span>
			            <span class="fs-6 text-dark">(商談成立！)</span>
			        </p>
			        <small class="text-success fw-bold">※あなた専用の価格です。24時間以内に購入してください。</small>
			    </div>

			    <div th:if="${myWinningOffer == null}">
			        <p class="fs-4 fw-bold">
			            ¥<span th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}"></span>
			        </p>
			    </div>
			</div>
		</div>
		
		<!-- 購入ボタン
			1.  **送信先 (`th:action`)**:
			    * `AppOrderController` で定義されている `@PostMapping("/orders/initiate-purchase")` を指定しています。
			2.  **パラメータ (`name="itemId"`)**:
			    * コントローラーが `@RequestParam("itemId")` を要求しているため、`input type="hidden"` で商品IDを渡しています。
			3.  **表示条件 (`th:if`)**:
			    * `item.status == '出品中'`: 売約済みの商品を買えないようにします。
			    * `item.seller.email != #authentication.name`: 自分の商品は買えないようにします（`#authentication.name` はログイン中のユーザー名/メールアドレスを取得するThymeleafの機能です）。

			これで、適切なユーザーにのみ購入ボタンが表示され、ボタンを押すと決済フロー（Stripe連携）が開始されるようになります。
		-->
		<div class="purchase-section" style="margin: 20px 0;">

		    <div th:if="${otherWinningOffer}" class="alert alert-secondary text-center">
		        <h4>🔒 商談中</h4>
		        <p>他のお客様への値下げ交渉が成立したため、<br>現在この商品は購入できません。</p>
		    </div>

		    <div th:if="${myWinningOffer != null}">
		        <form th:action="@{/orders/initiate-purchase}" method="post">
		            <input type="hidden" name="itemId" th:value="${item.id}" />
		            
		            <div class="alert alert-success text-center">
		                <strong>おめでとうございます！</strong><br>
		                値下げ申請が承諾されました。
		            </div>
		            
		            <button type="submit" class="button"
		                style="background-color: #dc3545; color: white; width: 100%; font-size: 1.4em; font-weight: bold; border: 2px solid #a71d2a;">
		                値下げ価格で購入する
		            </button>
		        </form>
		    </div>

		    <div th:if="${item.status == '出品中' and !isOwner and otherWinningOffer == null and myWinningOffer == null}">
		        <form th:action="@{/orders/initiate-purchase}" method="post">
		            <input type="hidden" name="itemId" th:value="${item.id}" />
		            <button type="submit" class="button"
		                style="background-color: #ff9900; color: white; width: 100%; font-size: 1.2em;">
		                購入手続きへ
		            </button>
		        </form>
		    </div>

		    <div th:if="${item.status != '出品中'}" class="alert alert-warning text-center" style="color: red; font-weight: bold;">
		        SOLD OUT (売り切れ)
		    </div>

		    <div th:if="${isOwner}" class="text-center text-muted border p-2">
		        ※自分が出品した商品は購入できません
		    </div>

		</div>
		<div th:if="${!item.soldOut and !isOwner}" class="mt-3">
		    
		    <button type="button" class="btn btn-outline-warning w-100" data-bs-toggle="modal" data-bs-target="#offerModal">
		        値下げを申請する
		    </button>

		    <div class="modal fade" id="offerModal" tabindex="-1" aria-labelledby="offerModalLabel" aria-hidden="true">
		        <div class="modal-dialog">
		            <div class="modal-content">
		                <form th:action="@{/items/{id}/offers(id=${item.id})}" method="post">
		                    
		                    <div class="modal-header">
		                        <h5 class="modal-title" id="offerModalLabel">値下げ申請</h5>
		                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
		                    </div>
		                    
		                    <div class="modal-body">
		                        <p class="text-danger fw-bold">※申請は一度しかできません。取り消しもできません。</p>
		                        <p>現在の価格: <span th:text="${item.price}"></span>円</p>
		                        <p>希望価格を入力してください（100円単位）</p>
		                        
		                        <div class="input-group mb-3">
		                            <input type="number" name="requestedPrice" class="form-control" placeholder="例: 1500" required>
		                            <span class="input-group-text">円</span>
		                        </div>
		                        <small class="text-muted">※最大15%OFFまで申請可能です</small>
		                    </div>
		                    
		                    <div class="modal-footer">
		                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
		                        <button type="submit" class="btn btn-primary">申請する</button>
		                    </div>
		                </form>
		            </div>
		        </div>
		    </div>
		</div>
		</div>  <div th:if="${isOwner}" class="mt-3">
		    <a th:href="@{/items/{id}/offers(id=${item.id})}" class="btn btn-outline-primary w-100">
		        値下げ申請を確認する
		    </a>
		</div>

		<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
		<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
		<div>
			<div>
				<form th:if="${!isFavorited}" th:action="@{/items/{id}/favorite(id=${item.id})}" method="post">
					<button type="submit" class="button">お気に入りに追加</button>
				</form>
				<form th:if="${isFavorited}" th:action="@{/items/{id}/unfavorite(id=${item.id})}" method="post">
					<button type="submit" class="button danger">お気に入り解除</button>
				</form>
			</div>

			<h2>チャット</h2>
			<div class="chat-box">
				<div th:each="chat : ${chats}" class="chat-message"
					th:classappend="${chat.sender.email == #authentication.name ? 'my-message' : 'other-message'}">
					<span th:text="${chat.sender.name}"></span>
					<span th:text="${#temporals.format(chat.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
					<p th:text="${chat.message}"></p>
				</div>
				<p th:if="${#lists.isEmpty(chats)}">まだチャットメッセージはありません。</p>
			</div>

			<form th:action="@{/chat/{itemId}(itemId=${item.id})}" method="post">
				<textarea name="message" required></textarea>
				<button type="submit">送信</button>
			</form>

			<div class="button-group">
				<a th:href="@{/items}" class="button secondary">商品一覧に戻る</a>
			</div>
		</div>
</body>

</html>
