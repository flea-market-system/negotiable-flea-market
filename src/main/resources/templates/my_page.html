<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>マイページ - フリマアプリ</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div class="container">
		<div class="page-header">
			<h1>マイページ</h1>
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="button danger small">ログアウト</button>
			</form>
		</div>

		<p>ようこそ、<span th:text="${user.name}"></span>さん！</p>

		<div class="main-nav">
			<a th:href="@{/my-page/selling}" class="button">出品管理</a>
			<a th:href="@{/my-page/orders}" class="button">購入履歴</a>
			<a th:href="@{/my-page/sales}" class="button">販売履歴</a>
			<a th:href="@{/my-page/offers}" class="button">値下げ申請一覧</a>
			<a th:href="@{/my-page/favorites}" class="button">お気に入り</a>
			<a th:href="@{/my-page/reviews}" class="button">自分の評価</a>
		</div>

		<div class="account-info section">
			<h2>アカウント情報</h2>
			<p><strong>名前:</strong> <span th:text="${user.name}"></span></p>
			<p><strong>メールアドレス:</strong> <span th:text="${user.email}"></span></p>
			<p><strong>役割:</strong> <span th:text="${user.role}"></span></p>
		</div>

		<!-- 商談成立した商品のセクション -->
		<div th:if="${not #lists.isEmpty(winningOffers)}" class="mt-4 mb-5">
			<h2 style="color: #d9534f; border-bottom: 2px solid #d9534f; padding-bottom: 10px; margin-bottom: 20px;">
				🎉 商談成立！購入待ちの商品
			</h2>

			<div class="item-grid">
				<div class="item-card" th:each="offer : ${winningOffers}">
					<a th:href="@{/items/{id}(id=${offer.item.id})}" style="text-decoration: none; color: inherit;">
						<!-- 商品画像 -->
						<img th:src="${offer.item.imageUrl != null ? offer.item.imageUrl : '/images/placeholder.png'}"
							alt="商品画像">
						<!-- 商品名 -->
						<h3 th:text="${offer.item.name}"></h3>
						<p class="price" style="margin-bottom: 5px;">
							<span style="text-decoration: line-through; color: #999; font-size: 0.8em;">
								¥<span
									th:text="${#numbers.formatDecimal(offer.originalPrice, 0, 'COMMA', 0, 'POINT')}"></span>
							</span>
							<br>
							<span style="color: #d9534f; font-weight: bold;">
								¥<span
									th:text="${#numbers.formatDecimal(offer.requestedPrice, 0, 'COMMA', 0, 'POINT')}"></span>
							</span>
						</p>
						<!-- ステータスと期限 -->
						<p class="status">
							<span
								style="background-color: #d9534f; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold;">
								商談成立
							</span>
							<br>
							<small style="font-size: 0.7rem; color: #666; display: block; margin-top: 4px;">
								期限: <span th:text="${#temporals.format(offer.holdsUntil, 'MM/dd HH:mm')}"></span> まで
							</small>
						</p>
					</a>
				</div>
			</div>
		</div>
		<div class="button-group mt-5">
			<a th:href="@{/items}" class="button secondary">商品一覧に戻る</a>
		</div>
	</div>
</body>

</html>
